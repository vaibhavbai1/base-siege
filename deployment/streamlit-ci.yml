name: Public demo checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ui/requirements.txt
            deployment/requirements-test.txt
      - run: python -m pip install -r ui/requirements.txt -r deployment/requirements-test.txt
      - run: python -m pip check
      - run: python -m pytest tests/test_public_app.py -q
      - run: python tools/check_public_demo.py
