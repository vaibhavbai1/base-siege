name: Base Siege checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: base-siege-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests-and-demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - name: Select inference checkpoints for LFS checkout
        run: >-
          git config --global lfs.fetchinclude
          'runs/study-v2/*/model.zip,runs/version2-longer-control/*/model.zip,runs/version2-longer-control/*/milestones/step-000004194304.zip,runs/version2-seed-replication/*/model.zip,runs/study-v3/*/model.zip,artifacts/trpo/selected-T1/model.zip,artifacts/ddqn/selected-lr3e5-seed100-v2-benchmark/selected_model/policies/*.pt'
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ui/requirements.txt
            deployment/requirements-test.txt
            deployment/requirements-project-test.txt
      - run: python -m pip install -r ui/requirements.txt -r deployment/requirements-project-test.txt
      - run: python -m pip check
      - name: Run regressions and short recovery tests
        run: python -m pytest -q tests trpo/tests v3_final/tests v3_probe/tests --junitxml=artifacts/ci-tests.xml
      - name: Build standalone deployment source
        run: python tools/build_deploy_bundle.py --out artifacts/streamlit-deploy
      - name: Check standalone public app
        working-directory: artifacts/streamlit-deploy
        run: python tools/check_public_demo.py
      - uses: actions/upload-artifact@v7
        with:
          name: streamlit-deploy
          path: artifacts/streamlit-deploy.zip
          retention-days: 7
          if-no-files-found: error
