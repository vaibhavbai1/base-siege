<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Base Siege editor</title><link rel="stylesheet" href="editor.css"></head>
<body><main class="wrap"><div class="board"><canvas id="cv" width="544" height="544" tabindex="0" aria-label="Custom base editor. Use the row and column fields for keyboard placement."></canvas><p class="hint">Purple: Town Hall · pink: cannon · orange: mortar · grey: storage</p></div>
<aside><section><h2>Build your base</h2><label>Base name<input id="name" maxlength="80" value="My custom base"></label><div id="palette"></div><p id="inventory" class="hint"></p><p id="help" class="hint"></p><div class="row"><button id="undo">Undo</button><button id="clear-walls">Clear walls</button><button id="clear-all">Clear all</button></div>
<details><summary>Keyboard placement</summary><div class="row"><label>Row<input id="row" type="number" min="1" max="14" value="7"></label><label>Column<input id="col" type="number" min="1" max="14" value="7"></label><button id="place">Apply tool</button></div></details></section>
<section><h2>Try your layout</h2><p class="hint">Save a complete base, then choose who attacks. Use Download custom base JSON below to keep a copy.</p><button class="go" id="save">Save base</button><div class="row"><button class="go" id="manual">Play manually</button><button class="go" id="agent">Let agent play</button></div><p id="status" class="hint" role="status"></p></section></aside></main><script src="glyphs.js"></script><script src="editor.js"></script></body></html>
